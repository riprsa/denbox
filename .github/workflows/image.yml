# Tests the runtime and the installer, builds the image and runs the
# end-to-end tests against it: the runtime's with a stub box and no network,
# the real installer against a fixture environment, the real box built from
# the template, and a box in a tailnet of its own control server. On main, an image that passed them all is pushed as latest
# and as the commit.
#
# amd64 only. arm64 would need an arm64 runner (ubuntu-24.04-arm) running the
# same job, each pushing a per-architecture tag, and a final job joining them
# with `docker buildx imagetools create`; the Dockerfile already has the
# arm64 Nix checksum.
name: image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    # Seconds when it passes; without a limit a hung test holds the job for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends s6 shellcheck
      - run: shellcheck -x install.sh kit/runtime/denbox kit/runtime/askpass kit/runtime/tests/*.sh image/denbox image/login
      - run: kit/runtime/tests/unit.sh
      - run: python3 -m unittest discover -s deploy/tests

  image:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f image/Dockerfile -t denbox-test-image .
      - run: kit/runtime/tests/e2e.sh denbox-test-image
      - run: docker save denbox-test-image | zstd -T0 -3 > image.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: image.tar.zst
          retention-days: 1

  # The real installer, unattended, with Docker: it evaluates a fixture
  # environment's declaration, accepts it, renders and starts the box.
  install:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - run: zstd -dc image.tar.zst | docker load
      - run: deploy/tests/installer.sh denbox-test-image

  # A box from the template, built against this checkout of the kit. It
  # downloads nixpkgs, T3 Code and both agents.
  box:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - run: zstd -dc image.tar.zst | docker load
      - run: kit/runtime/tests/box.sh denbox-test-image

  # Boxes in a tailnet: Headscale, a box and a Tailscale client on a private
  # Docker network, the boxes built from kit/runtime/tests/tailnet and
  # deployed from their declarations, which Nix on the runner evaluates.
  tailscale:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - run: zstd -dc image.tar.zst | docker load
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: kit/runtime/tests/tailscale.sh denbox-test-image

  push:
    needs: [install, box, tailscale]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/riprsa/denbox
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zstd -dc image.tar.zst | docker load
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag denbox-test-image "$IMAGE:$GITHUB_SHA"
          docker tag denbox-test-image "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
