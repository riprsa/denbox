<!doctype html>
<html>
<head>
<title>Box</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 12px 16px; background: #000; color: #fff;
    font: 12px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  main { max-width: 760px; }
  section { margin-bottom: 16px; }
  h2 { display: flex; gap: 12px; align-items: baseline; margin: 0 0 4px; font: inherit; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 1px 16px 1px 0; white-space: nowrap; vertical-align: baseline; }
  td.wide { width: 100%; white-space: normal; }
  td.num { text-align: right; }
  button { padding: 0 6px; background: #000; color: #fff; border: 1px solid #333; font: inherit; cursor: pointer; }
  button:hover { border-color: #888; }
  button:disabled { color: #777; border-color: #222; cursor: default; }
  .dim { color: #888; }
  .down, .bad { color: #ff6b6b; }
  .bar { display: inline-block; width: 120px; height: 6px; vertical-align: middle; background: #1a1a1a; }
  .bar i { display: block; height: 100%; background: #fff; }
</style>
</head>
<body>
  <main>
    <p id="error" class="bad" hidden></p>
    <section><h2>System</h2><div id="system"></div></section>
    <section><h2>Services <button id="restart-all">Restart all</button><span id="services-note"></span></h2><div id="services"></div></section>
    <section><h2>Ports</h2><div id="ports"></div></section>
  </main>
</body>
</html>
