# The standard deployment of one box on a Docker host.
#
#   docker volume create denbox-NAME-home
#   docker volume create denbox-NAME-nix
#   DENBOX_NAME=NAME DENBOX_BOOTSTRAP_FILE=... DENBOX_GIT_TOKEN_FILE=... \
#     docker compose -f deploy/compose.yaml up -d
#
# The volumes are external so that `docker compose down -v` cannot delete a
# box's home or store. An environment adds overlays with more -f files.
name: denbox-${DENBOX_NAME:?Set DENBOX_NAME to the box's name}
services:
  box:
    image: ${DENBOX_IMAGE:-ghcr.io/riprsa/denbox:latest}
    # T3 Code labels the environment with the hostname.
    hostname: ${DENBOX_NAME}
    restart: unless-stopped
    # The bootstrap: /run/secrets/denbox_bootstrap and /run/secrets/denbox_git_token.
    secrets: [denbox_bootstrap, denbox_git_token]
    volumes:
      - home:/root
      - nix:/nix
    tmpfs:
      - /run/denbox:mode=0700
      # Docker mounts a tmpfs noexec by default; Nix builds run scripts in /tmp.
      - /tmp:mode=1777,exec
    # T3 Code and denbox-api. denbox-api listens on 127.0.0.1 in the box
    # unless denbox.api.address says otherwise, as it must for this port.
    ports:
      - "${DENBOX_BIND_IP:-127.0.0.1}:${DENBOX_T3_PORT:-3773}:3773"
      - "${DENBOX_BIND_IP:-127.0.0.1}:${DENBOX_API_PORT:-48099}:48099"
    cpus: ${DENBOX_CPUS:-2}
    mem_limit: ${DENBOX_MEMORY:-4g}
    pids_limit: ${DENBOX_PIDS:-2048}
    # s6 gives each service up to 35 seconds to stop.
    stop_grace_period: 60s
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
secrets:
  denbox_bootstrap:
    file: ${DENBOX_BOOTSTRAP_FILE:?Set DENBOX_BOOTSTRAP_FILE to the bootstrap JSON}
  denbox_git_token:
    file: ${DENBOX_GIT_TOKEN_FILE:?Set DENBOX_GIT_TOKEN_FILE to the Git token file, empty for a public repository}
volumes:
  home:
    name: denbox-${DENBOX_NAME}-home
    external: true
  nix:
    name: denbox-${DENBOX_NAME}-nix
    external: true
